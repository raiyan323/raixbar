# ============================================================
# RAIXBAR
# Waybar-style full width bar
#
# LEFT | CENTER | RIGHT
# ============================================================


# ============================================================
# BAR
# ============================================================

[bar]
width = 1350
height = 44

position = "top"

margin_top = 0
margin_bottom = 0
margin_left = 0
margin_right = 0

exclusive_zone = 44

layer = "top"
keyboard_mode = "none"


# ============================================================
# STYLE
#
# IMPORTANT:
#
# bar_background controls ONLY the full bar.
#
# Set:
#
# bar_background = "transparent"
#
# for no bar background.
#
# Individual modules have their own backgrounds below.
# ============================================================

[style]

bar_background = "transparent"
bar_opacity = 1.0

bar_border_color = "transparent"
bar_border_width = 0
bar_radius = 0


# Generic module fallback

module_background = "rgba(255,255,255,0.055)"
module_opacity = 1.0

module_hover_background = "rgba(255,255,255,0.09)"

module_border_color = "transparent"
module_border_width = 0
module_radius = 9


# General colors

text_color = "#cdd6f4"
muted_color = "#6c7086"
accent_color = "#89b4fa"


# ============================================================
# WORKSPACE STYLE
# ============================================================

workspace_background = "rgba(255,255,255,0.035)"

workspace_active_background = "rgba(137,180,250,0.20)"

workspace_hover_background = "rgba(255,255,255,0.08)"

workspace_urgent_background = "rgba(243,139,168,0.22)"

workspace_active_color = "#ffffff"
workspace_inactive_color = "#6c7086"
workspace_urgent_color = "#f38ba8"

workspace_border_color = "transparent"
workspace_border_width = 0
workspace_radius = 8


# ============================================================
# CLOCK STYLE
# ============================================================

clock_background = "rgba(255,255,255,0.055)"
clock_opacity = 1.0

clock_hover_background = "rgba(255,255,255,0.09)"

clock_border_color = "transparent"
clock_border_width = 0
clock_radius = 9


# ============================================================
# FONT
# ============================================================

[font]

family = "JetBrainsMono Nerd Font"

size = 12
weight = 650

logo_size = 17
workspace_size = 12


# ============================================================
# SPACING
# ============================================================

[spacing]

zone = 0

module = 4

horizontal = 10
vertical = 3

bar_horizontal = 5
bar_vertical = 4


# ============================================================
# LAYOUT
# ============================================================

[layout]

left = [
    "logo",
    "workspaces"
]

center = [
    "clock"
]

right = [
    "cpu",
    "ram",
    "network",
    "volume",
    "battery"
]


# ============================================================
# LOGO
# ============================================================

[logo]

enabled = true

icon = ""
text = "Raix"

icon_color = "#89b4fa"
text_color = "#cdd6f4"

background = "transparent"
hover_background = "rgba(255,255,255,0.08)"

padding = 9
radius = 9


# ============================================================
# WORKSPACES
#
# WANT ONLY 1-5?
#
# numbers = [1, 2, 3, 4, 5]
#
# WANT 1-4?
#
# numbers = [1, 2, 3, 4]
#
# WANT 1-3?
#
# numbers = [1, 2, 3]
# ============================================================

[workspaces]

enabled = true

numbers = [
    1,
    2,
    3,
    4,
    5
]

show_empty = true

format = "{id}"

padding = 9

gap = 2

scroll_switch = true

left_click = "hyprctl dispatch workspace {id}"

right_click = ""

middle_click = ""

interval = 500


# ============================================================
# CPU
# ============================================================

[cpu]

enabled = true

format = "{icon}  {value}%"
icon = "󰍛"

color = "#cba6f7"

background = "rgba(203,166,247,0.10)"
hover_background = "rgba(203,166,247,0.18)"

opacity = 1.0

border_color = "transparent"
border_width = 0

padding = 10
radius = 9

interval = 1000

tooltip = "CPU Usage"

left_click = "kitty -e btop"
right_click = ""
middle_click = ""

scroll_up = ""
scroll_down = ""


# ============================================================
# RAM
# ============================================================

[ram]

enabled = true

format = "{icon}  {value}%"
icon = "󰘚"

color = "#a6e3a1"

background = "rgba(166,227,161,0.10)"
hover_background = "rgba(166,227,161,0.18)"

opacity = 1.0

border_color = "transparent"
border_width = 0

padding = 10
radius = 9

interval = 1000

tooltip = "Memory Usage"

left_click = "kitty -e btop"
right_click = ""
middle_click = ""

scroll_up = ""
scroll_down = ""


# ============================================================
# NETWORK
# ============================================================

[network]

enabled = true

format = "{icon}  {value}"
icon = "󰖩"

color = "#89dceb"

background = "rgba(137,220,235,0.10)"
hover_background = "rgba(137,220,235,0.18)"

opacity = 1.0

border_color = "transparent"
border_width = 0

padding = 10
radius = 9

interval = 1000

tooltip = "Network"

left_click = "nm-connection-editor"
right_click = "kitty -e nmtui"
middle_click = ""

scroll_up = ""
scroll_down = ""


# ============================================================
# VOLUME
# ============================================================

[volume]

enabled = true

format = "{icon}  {value}%"
icon = "󰕾"

color = "#f5c2e7"

background = "rgba(245,194,231,0.10)"
hover_background = "rgba(245,194,231,0.18)"

opacity = 1.0

border_color = "transparent"
border_width = 0

padding = 10
radius = 9

interval = 500

tooltip = "Audio Volume"

left_click = "pavucontrol"

right_click = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"

middle_click = ""

scroll_up = "wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+"
scroll_down = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"


# ============================================================
# BATTERY
# ============================================================

[battery]

enabled = true

format = "{icon}  {value}%"
icon = "󰁹"

color = "#f9e2af"

background = "rgba(249,226,175,0.10)"
hover_background = "rgba(249,226,175,0.18)"

opacity = 1.0

border_color = "transparent"
border_width = 0

padding = 10
radius = 9

interval = 5000

tooltip = "Battery"

left_click = ""
right_click = ""
middle_click = ""

scroll_up = ""
scroll_down = ""


# ============================================================
# CLOCK
# ============================================================

[clock]

enabled = true

format = "%a  %d %b  •  %H:%M"

color = "#89b4fa"

background = "rgba(137,180,250,0.10)"
hover_background = "rgba(137,180,250,0.18)"

opacity = 1.0

border_color = "transparent"
border_width = 0

font_size = 12
font_weight = 800

padding = 14
radius = 9

interval = 1000

left_click = ""
right_click = ""
middle_click = ""